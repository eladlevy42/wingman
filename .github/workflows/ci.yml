name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Format, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Added with #507. Until then CI ran no tests at all for any workspace,
      # so a red suite could reach main as long as it typechecked. This runs
      # every workspace's `test` script through Turborepo, which for
      # apps/mobile means both runners: Vitest for the logic and Jest/RNTL for
      # the components (ADR-0035).
      - name: Test
        run: pnpm test
